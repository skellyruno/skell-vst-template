name: Build SkellCore VST Template (Windows VST3 + Standalone)
# Iterative plugin development often pushes many commits. Cancel superseded
# branch/PR runs to avoid multiple resource-heavy JUCE builds in parallel.
# Avoid duplicate push/PR CI for one feature branch, without ever
# cancelling main, production, release, tag or manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/production/') || github.head_ref == 'main' || github.head_ref == 'production' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'production/')) && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/production/') && github.head_ref != 'main' && github.head_ref != 'production' && !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'production/') }}

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'SkellCore/**'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tools/SkellCoreHostReadinessMain.cpp'
      - 'tools/Run-SkellHostValidation.ps1'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'SkellCore/**'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tools/SkellCoreHostReadinessMain.cpp'
      - 'tools/Run-SkellHostValidation.ps1'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DSKELLCORE_BUILD_HOST_READINESS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Actual JUCE plugin lifecycle, state, automation and 36-case CPU matrix
        shell: pwsh
        run: |
          $hostSmoke = Get-ChildItem build -Recurse -File -Filter 'SkellCoreHostReadiness.exe' | Select-Object -First 1
          if (-not $hostSmoke) { throw 'Host-readiness executable missing' }
          & $hostSmoke.FullName 2>&1 | Tee-Object -FilePath skell-host-readiness.txt
          if ($LASTEXITCODE -ne 0) { throw "Host-readiness check failed: $LASTEXITCODE" }
          @((Get-Content skell-host-readiness.txt) | Where-Object { $_ -match '^SKELL_MATRIX_CSV,' }) |
            ForEach-Object { $_ -replace '^SKELL_MATRIX_CSV,', '' } |
            Set-Content -Path skell-host-matrix.csv -Encoding utf8
          if (@(Get-Content skell-host-matrix.csv).Count -ne 37) { throw 'Expected 36 host CPU matrix rows plus header' }
      - name: Save host-readiness measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 14
          name: SkellCore-Host-Readiness-Report
          path: |
            skell-host-readiness.txt
            skell-host-matrix.csv
          if-no-files-found: warn
      - name: Record exact packaged binary identity
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'VST3 bundle missing' }
          $binary = Get-ChildItem $bundle.FullName -Recurse -File -Filter '*.vst3' | Select-Object -First 1
          if (-not $binary) { throw 'VST3 x64 binary missing from bundle' }
          $standalone = Get-ChildItem build -Recurse -File -Filter 'Skell Quickstart.exe' | Select-Object -First 1
          if (-not $standalone) { throw 'Standalone exe missing' }
          $manifest = [ordered]@{
            schema = 'skellcore-windows-build/1'
            commit = (git rev-parse HEAD)
            git_ref = $env:GITHUB_REF
            runner = $env:RUNNER_OS
            generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            vst3_bundle = $bundle.Name
            vst3_binary = $binary.Name
            vst3_binary_sha256 = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash
            standalone_sha256 = (Get-FileHash $standalone.FullName -Algorithm SHA256).Hash
            host_matrix_cases = 36
            editor_branding_approved = $false
            fl_studio_acceptance_verified = $false
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content SkellCore-Build-Manifest.json -Encoding utf8
      - name: Upload exact binary manifest
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: SkellCore-Build-Manifest
          path: SkellCore-Build-Manifest.json
          if-no-files-found: error
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SkellCore-Template-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: SkellCore-Template-Windows-VST3
          path: SkellCore-Template-Windows-VST3.zip
          if-no-files-found: error

      - name: Package Standalone
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path build -File -Recurse -Filter 'Skell Quickstart.exe' | Select-Object -First 1
          if (-not $app) { throw 'Skell Quickstart standalone executable missing' }
          Compress-Archive -Path $app.FullName -DestinationPath SkellCore-Template-Windows-Standalone.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: SkellCore-Template-Windows-Standalone
          path: SkellCore-Template-Windows-Standalone.zip
          if-no-files-found: error
