name: SkellCore / Generated Plugin VST3 Smoke

# Cancel older UI/build runs on superseded development commits.
# Avoid duplicate push/PR CI for one feature branch, without ever
# cancelling main, production, release, tag or manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/production/') || github.head_ref == 'main' || github.head_ref == 'production' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'production/')) && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/production/') && github.head_ref != 'main' && github.head_ref != 'production' && !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'production/') }}

on:
  push:
    branches: ['feature/**']
    paths:
      - 'Source/**'
      - 'SkellCore/include/SkellCore/**'
      - 'SkellCore/CMakeLists.txt'
      - 'tools/new_plugin.py'
      - 'CMakeLists.txt'
      - '.github/workflows/generated-plugin-smoke.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'SkellCore/include/SkellCore/**'
      - 'SkellCore/CMakeLists.txt'
      - 'tools/new_plugin.py'
      - 'tools/SkellCoreUiRendererMain.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/generated-plugin-smoke.yml'
  workflow_dispatch:

jobs:
  generated-vst3:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create a plugin with the default pinned SkellCore revision
        shell: pwsh
        run: |
          python tools/new_plugin.py "Skell Generated Smoke" generated-smoke --code Sg93
          if ($LASTEXITCODE -ne 0) { throw 'Plugin generation failed' }
          if (-not (Test-Path generated-smoke/Source/PluginEditor.cpp)) {
            throw 'Generated editor source missing'
          }
      - name: Compile-check shared UI, Movement and themed menus from pinned SkellCore
        shell: pwsh
        run: |
          @'
          #include <SkellCore/SkellPresetBar.h>
          #include <SkellCore/SkellMeterControls.h>
          #include <SkellCore/SkellResponsiveLayout.h>
          #include <SkellCore/FDN.h>
          #include <SkellCore/SkellMovement.h>
          #include <SkellCore/SkellMovementJUCE.h>
          #include <SkellCore/SkellMenuTheme.h>
          #include <SkellCore/SkellUnifiedControls.h>
          int skellSharedUiContractCompile() {
              skellcore::ui::SkellPresetBar bar;
              bar.setPresets(juce::StringArray{"One", "Two"}, 0);
              skellcore::ui::SkellStereoMeter meter;
              meter.pushLevels(0.25f, 0.5f, 1.f/24.f);
              const auto cells = skellcore::ui::skellResponsiveCells(
                  {0, 0, 400, 200}, 4, 110, 52, 6, 3);
              skellcore::FDNReverb8 fdn8;
              skellcore::FDNReverb16 fdn16;
              fdn8.prepare(48000.0);
              fdn16.prepare(48000.0);
              const auto audio8 = fdn8.processFrame(0.2f, -0.2f);
              const auto audio16 = fdn16.processFrame(0.2f, -0.2f);
              skellcore::ui::SkellMovement movement;
              movement.tick();
              skellcore::ui::SkellMovementAnimator animator;
              skellcore::ui::SkellHardwareLookAndFeel pluginLook;
              auto productColours = pluginLook.palette();
              productColours.accent = juce::Colour(0xff46de53);
              pluginLook.setPalette(productColours);
              skellcore::ui::SkellPowerButton powerButton;
              skellcore::ui::SkellSettingsSurface settingsSurface;
              skellcore::ui::SkellAudioLine audioLine;
              powerButton.setPalette(productColours);
              settingsSurface.setPalette(productColours);
              audioLine.setPalette(productColours);
              juce::PopupMenu customMenu;
              skellcore::ui::styleSkellPopup(customMenu, pluginLook);
              return bar.presetCount() + static_cast<int>(cells.size())
                     + (audio8[0] > 0.f && audio16[1] < 0.f ? 1 : 0);
          }
          '@ | Set-Content -Path generated-smoke/tools/SharedUICompile.cpp -Encoding utf8
          @'
          add_library(SkellSharedUiHeaderSmoke OBJECT tools/SharedUICompile.cpp)
          target_link_libraries(SkellSharedUiHeaderSmoke PRIVATE SkellCore::UI)
          target_compile_features(SkellSharedUiHeaderSmoke PRIVATE cxx_std_17)
          '@ | Add-Content -Path generated-smoke/CMakeLists.txt
      - name: Configure generated VST3 using its actual pinned dependency
        run: cmake -S generated-smoke -B generated-build -A x64
      - name: Compile generated Windows VST3
        run: cmake --build generated-build --config Release --target SkellGeneratedSmoke_VST3 SkellSharedUiHeaderSmoke --parallel 2
      - name: Verify generated VST3 bundle exists
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem generated-build -Recurse -Directory -Filter '*.vst3')
          if ($bundles.Count -eq 0) {
            throw 'Newly generated plugin did not produce a VST3 bundle'
          }
