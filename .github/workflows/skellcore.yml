name: SkellCore portable DSP tests
on:
  push:
    paths:
      - "SkellCore/**"
      - ".github/workflows/skellcore.yml"
  pull_request:
    paths:
      - "SkellCore/**"
      - ".github/workflows/skellcore.yml"
jobs:
  core-native:
    name: Core native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S SkellCore -B build-core -DSKELLCORE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-core --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-core --build-config Release --output-on-failure
      - name: Verify plugin generator
        run: python tools/test_new_plugin.py
