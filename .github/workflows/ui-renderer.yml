name: SkellCore / Headless JUCE UI renderer

# Cancel older UI/build runs on superseded development commits.
# Avoid duplicate push/PR CI for one feature branch, without ever
# cancelling main, production, release, tag or manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/production/') || github.head_ref == 'main' || github.head_ref == 'production' || startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'production/')) && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/production/') && github.head_ref != 'main' && github.head_ref != 'production' && !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'production/') }}

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'SkellCore/include/SkellCore/**'
      - 'SkellCore/CMakeLists.txt'
      - 'tools/SkellCoreUiRendererMain.cpp'
      - 'tools/new_plugin.py'
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ui-renderer.yml'
  pull_request:
    paths:
      - 'SkellCore/include/SkellCore/**'
      - 'SkellCore/CMakeLists.txt'
      - 'tools/SkellCoreUiRendererMain.cpp'
      - 'tools/new_plugin.py'
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ui-renderer.yml'
  workflow_dispatch:

jobs:
  screenshot-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure renderer against the real editor
        run: cmake -S . -B build -A x64 -DSKELLCORE_BUILD_UI_RENDERER=ON
      - name: Compile renderer
        run: cmake --build build --config Release --target SkellCoreUISmokeRenderer --parallel 2
      - name: Capture and validate screenshots
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -File -Filter SkellCoreUISmokeRenderer.exe | Select-Object -First 1
          if (-not $exe) { throw 'Renderer executable not found' }
          & $exe.FullName (Join-Path (Get-Location) 'ui-screenshots')
          if ($LASTEXITCODE -ne 0) { throw "Renderer failed with exit code $LASTEXITCODE" }
          $images = @(Get-ChildItem ui-screenshots -Filter *.png)
          if ($images.Count -ne 13) { throw "Expected 13 skin/size/tour PNGs, found $($images.Count)" }
          if (-not (Test-Path ui-screenshots/manifest.json)) { throw 'Missing screenshot manifest' }
      - uses: actions/upload-artifact@v4
        with:
          name: SkellCore-Headless-UI-Screenshots
          path: ui-screenshots/*
          if-no-files-found: error
          retention-days: 14
